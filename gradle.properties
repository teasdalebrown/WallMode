# Prefer desktop responsiveness over build throughput. Heap is not total process RAM.
org.gradle.jvmargs=-Xmx1024m -XX:ActiveProcessorCount=1 -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.priority=low
# A single-use daemon may run during a build, but should not stay alive afterward.
org.gradle.daemon=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
kotlin.compiler.execution.strategy=in-process
