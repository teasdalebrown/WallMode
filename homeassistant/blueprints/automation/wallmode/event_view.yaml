blueprint:
  name: WallMode — doorbell or event view
  description: >-
    Temporarily show a camera web page or dashboard when your chosen trigger fires,
    then restore the previous display automatically. Paste a complete HTTP(S) page URL
    that already works on the tablet. This does not convert a camera entity or RTSP
    stream into live video. Optionally speak a short announcement at the same time.
  domain: automation
  author: WallMode
  homeassistant:
    min_version: "2024.11.0"
  input:
    wallmode_device:
      name: WallMode tablet
      selector:
        device:
          filter:
            - integration: mqtt
    triggers:
      name: When to show the page
      description: For example, your doorbell's pressed event.
      selector:
        trigger: {}
    conditions:
      name: Only if
      default: []
      selector:
        condition: {}
    view_url:
      name: Camera or dashboard page URL
      description: >-
        Full http:// or https:// URL; no embedded username or password.
        The page and its camera player must work in WallMode's WebView.
      selector:
        text:
          type: url
    duration:
      name: Show for
      default: 30
      selector:
        number:
          min: 5
          max: 600
          step: 1
          unit_of_measurement: seconds
          mode: slider
    priority:
      name: Priority
      description: Higher priority can interrupt lower-priority event views or cards.
      default: 70
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider
    announcement:
      name: Optional spoken message
      description: Leave empty for no speech; otherwise use up to 255 characters on one line.
      default: ""
      selector:
        text: {}
    volume:
      name: Announcement volume
      default: 80
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

triggers: !input triggers
conditions: !input conditions
variables:
  wallmode_device: !input wallmode_device
  view_url: !input view_url
  duration: !input duration
  priority: !input priority
  announcement: !input announcement
  volume: !input volume
  device_identifier: >-
    {% set found = namespace(ids=[]) %}
    {% for domain, identifier in device_attr(wallmode_device, 'identifiers') or [] %}
      {% if domain == 'mqtt' and identifier is match('^wallmode_[a-z0-9]{1,16}$') %}
        {% set found.ids = found.ids + [identifier] %}
      {% endif %}
    {% endfor %}
    {{ found.ids[0] if found.ids | length == 1 else '' }}
  base_topic: "{{ 'wallmode/' ~ device_identifier[9:] }}"
actions:
  - if:
      - condition: template
        value_template: "{{ not device_identifier }}"
    then:
      - stop: Select a WallMode MQTT device.
        error: true
  - if:
      - condition: template
        value_template: >-
          {{ not (view_url | trim is match('(?i)^https?://[^/?#@\s]+(?:[/?#][^\s]*)?$'))
             or not (5 <= duration | int <= 600 and 0 <= priority | int <= 100
                     and 0 <= volume | int <= 100)
             or (announcement | trim).encode('utf-16-le') | length > 510
             or announcement is search('[\x00-\x1f\x7f-\x9f]') }}
    then:
      - stop: Check the complete HTTP(S) URL, duration, priority and one-line announcement.
        error: true
  - variables:
      view_id: "{{ 'wm_view_' ~ context.id }}"
  - variables:
      view_payload: >-
        {{ {'action': 'show', 'id': view_id, 'url': view_url | trim,
            'ttl': duration | int, 'priority': priority | int} }}
  - if:
      - condition: template
        value_template: "{{ (view_payload | to_json).encode('utf-16-le') | length > 4096 }}"
    then:
      - stop: The URL makes the event command too long. Use a shorter page URL.
        error: true
  - action: mqtt.publish
    data:
      topic: "{{ base_topic ~ '/command/takeover' }}"
      payload: "{{ view_payload | to_json }}"
      qos: 1
      retain: false
  - if:
      - condition: template
        value_template: "{{ announcement | trim | length > 0 }}"
    then:
      - action: mqtt.publish
        data:
          topic: "{{ base_topic ~ '/command/announce' }}"
          payload: "{{ {'text': announcement | trim, 'volume': volume | int} | to_json }}"
          qos: 1
          retain: false
# The tablet owns expiry. A later trigger replaces/extends the view; there is no
# delayed clear command that could accidentally dismiss the replacement.
mode: restart
